<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto AID II</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sitio en contenedor Docker - v2</h1>
    <p>Automatización de Infraestructura Digital II</p>
  </header>
  <main>
    <h2>Contacto</h2>
    <form id="contacto" novalidate>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" maxlength="50" required>
      <label for="correo">Correo</label>
      <input type="email" id="correo" maxlength="80" required>
      <button type="submit">Enviar</button>
      <p id="mensaje" role="status"></p>
    </form>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
